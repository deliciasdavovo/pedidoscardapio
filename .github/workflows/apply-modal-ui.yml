name: Apply product modal UI patch

on:
  push:
    branches:
      - ui/modal-produto-20260911
    paths:
      - .github/workflows/apply-modal-ui.yml

permissions:
  contents: write

jobs:
  patch-modal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply modal redesign
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          old_panel = 'bg-[#F4F1EA] rounded-t-[2rem] shadow-2xl max-h-[92vh] flex flex-col translate-y-full'
          new_panel = 'bg-[#F4F1EA] rounded-t-[2rem] shadow-2xl max-h-[96vh] flex flex-col translate-y-full'
          assert text.count(old_panel) == 1, 'product modal panel marker not found exactly once'
          text = text.replace(old_panel, new_panel, 1)

          new_build = r'''function buildProductModalContent(item) {
              const hasKg = item.units && item.units.includes('kg');
              const hasUnitToggle = item.units && item.units.includes('un') && item.units.includes('kg');
              const hasSizes = item.sizes && item.sizes.length > 0;
              const hasFlavors = item.flavors && item.flavors.length > 0;
              const initialQty = item.isKit ? 10 : (item.units && item.units[0] === 'kg' ? 0.5 : 1);
              const imgSrc = currentModalImages[0] || '';
              const hasMultiImg = currentModalImages.length > 1;

              return `
                  <div class="relative h-[34vh] min-h-[240px] max-h-[340px] overflow-hidden bg-[#ECE9E1]">
                      <img id="modal-img" src="${escapeHtml(imgSrc)}" onerror="handleImgError(this)" class="w-full h-full object-cover">
                      ${hasMultiImg ? `
                          <button onclick="modalPrevImage()" class="absolute left-3 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white w-9 h-9 rounded-full shadow-md flex items-center justify-center active:scale-90 transition-all">
                              <i class="fas fa-chevron-left text-xs text-[#22201C]"></i>
                          </button>
                          <button onclick="modalNextImage()" class="absolute right-3 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white w-9 h-9 rounded-full shadow-md flex items-center justify-center active:scale-90 transition-all">
                              <i class="fas fa-chevron-right text-xs text-[#22201C]"></i>
                          </button>
                          <div class="absolute bottom-3 left-0 right-0 flex justify-center gap-2">
                              ${currentModalImages.map((_, idx) => `<div id="modal-dot-${idx}" class="w-2 h-2 rounded-full ${idx === 0 ? 'bg-white' : 'bg-white/40'} shadow transition-all"></div>`).join('')}
                          </div>
                      ` : ''}
                  </div>

                  <div class="px-5 pt-4 pb-5 space-y-3">
                      <div>
                          <p class="text-[10px] uppercase font-semibold tracking-[0.12em] text-[#8C8676] mb-0.5">${escapeHtml(item.category)}</p>
                          <h2 class="text-[19px] serif-font text-[#22201C] leading-snug mb-1">${escapeHtml(item.name)}</h2>
                          <p id="modal-description" class="text-[12.5px] text-[#22201C]/55 leading-relaxed">${escapeHtml(item.description)}</p>
                      </div>

                      ${hasUnitToggle ? `
                      <div class="flex bg-[#ECE9E1] p-1 rounded-xl border border-[#8C8676]/5">
                          <button onclick="setModalUnit('un')" id="modal-unit-un" class="flex-1 py-2 rounded-lg text-[12px] font-semibold bg-[#2C4A34] text-white transition-all">Unidade</button>
                          <button onclick="setModalUnit('kg')" id="modal-unit-kg" class="flex-1 py-2 rounded-lg text-[12px] font-semibold text-[#8C8676]/50 transition-all">Kilo</button>
                      </div>
                      ` : ''}

                      ${hasSizes ? `
                      <div class="space-y-1.5">
                          <label class="text-[11px] font-semibold text-[#8C8676]">Escolha o tamanho</label>
                          <div class="grid ${item.sizes.length === 2 ? 'grid-cols-2' : 'grid-cols-3'} gap-1 bg-[#ECE9E1] p-1 rounded-xl">
                              ${item.sizes.map((s, idx) => `
                                  <button onclick="setModalSize(${idx})" id="modal-size-${idx}" class="${idx === 0 ? 'bg-[#8C8676] text-white' : 'text-[#8C8676]/60'} py-2 rounded-lg text-[11px] font-medium transition-all">
                                      ${escapeHtml(s.label)}
                                      ${s.description ? `<span class="block text-[8px] font-normal opacity-70 normal-case tracking-normal mt-0.5 leading-tight">${escapeHtml(s.description)}</span>` : ''}
                                  </button>
                              `).join('')}
                          </div>
                      </div>
                      ` : ''}

                      ${hasFlavors ? `
                      <div class="space-y-1.5">
                          <div class="flex items-center justify-between gap-3">
                              <label for="modal-flavor" class="text-[12px] font-semibold text-[#2C4A34]">Escolha seu sabor</label>
                              <span class="text-[10px] text-[#8C8676]/70">Selecione uma opção</span>
                          </div>
                          <div class="relative">
                              <select id="modal-flavor" onchange="onModalFlavorChange()" class="w-full bg-white border border-[#8C8676]/15 rounded-xl pl-4 pr-11 py-3 text-[13px] focus:outline-none focus:ring-2 focus:ring-[#2C4A34]/15 appearance-none text-[#22201C] shadow-sm">
                                  <option value="" selected disabled>Escolha seu sabor</option>
                                  ${getFlavorList(item).map(f => `<option value="${escapeHtml(f.label)}">${escapeHtml(f.label)}</option>`).join('')}
                              </select>
                              <i class="fas fa-chevron-down pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-[10px] text-[#8C8676]"></i>
                          </div>
                      </div>
                      ` : ''}

                      <div class="flex items-center justify-between gap-4 pt-0.5">
                          <div class="inline-flex items-stretch bg-white rounded-xl shadow-sm border border-[#8C8676]/15 overflow-hidden">
                              <button onclick="changeModalQty(-1)" class="w-10 h-10 flex items-center justify-center text-[#2C4A34] text-xs hover:bg-[#2C4A34]/5 active:bg-[#2C4A34]/10 transition-colors"><i class="fas fa-minus"></i></button>
                              <input type="number" id="modal-qty" value="${initialQty}" step="${item.units && item.units[0] === 'kg' ? '0.1' : '1'}" oninput="updateModalPricePreview()" class="w-11 bg-transparent text-center text-[13px] font-semibold text-[#22201C] border-x border-[#8C8676]/15 focus:outline-none">
                              <button onclick="changeModalQty(1)" class="w-10 h-10 flex items-center justify-center text-[#2C4A34] text-xs hover:bg-[#2C4A34]/5 active:bg-[#2C4A34]/10 transition-colors"><i class="fas fa-plus"></i></button>
                          </div>
                          <div class="text-right min-w-0">
                              <p class="text-[22px] leading-none font-bold tracking-tight text-[#2C4A34]" id="modal-price-preview">R$ 0,00</p>
                              <p class="text-[10px] text-[#8C8676] font-medium mt-1" id="modal-unit-price-label"></p>
                          </div>
                      </div>

                      <div class="flex justify-end pt-0.5">
                          <button onclick="addToCartFromModal()" class="btn-primary w-auto min-w-[148px] px-5 py-2.5 rounded-xl text-[13px] tracking-[-0.01em] font-semibold active:scale-95 inline-flex items-center justify-center gap-2.5">
                              <i class="fas fa-shopping-basket text-xs"></i>
                              ${item.isKit ? 'Montar Kit' : 'Adicionar'}
                          </button>
                      </div>
                  </div>
              `;
          }'''

          pattern = r"function buildProductModalContent\(item\) \{.*?\n\}\n\nfunction getModalUnit\(\) \{"
          replacement = new_build + "\n\nfunction getModalUnit() {"
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          assert count == 1, 'buildProductModalContent block not replaced'

          old_get_unit = '''function getModalUnit() {
              const btnKg = document.getElementById('modal-unit-kg');
              return (btnKg && btnKg.classList.contains('bg-[#2C4A34]')) ? 'kg' : 'un';
          }'''
          new_get_unit = '''function getModalUnit() {
              const item = MENU_ITEMS.find(i => i.id === currentModalItemId);
              if (item && Array.isArray(item.units) && item.units.includes('kg') && !item.units.includes('un')) return 'kg';
              const btnKg = document.getElementById('modal-unit-kg');
              return (btnKg && btnKg.classList.contains('bg-[#2C4A34]')) ? 'kg' : 'un';
          }'''
          assert text.count(old_get_unit) == 1, 'getModalUnit marker not found exactly once'
          text = text.replace(old_get_unit, new_get_unit, 1)

          old_variant = '''    if (item.variants && item.variants[flavor]) {
                  const variant = item.variants[flavor];
                  const newImages = (variant.images && variant.images.length) ? variant.images'''
          new_variant = '''    if (item.variants && item.variants[flavor]) {
                  const variant = item.variants[flavor];
                  const descEl = document.getElementById('modal-description');
                  if (descEl) descEl.textContent = variant.description || item.description;
                  const newImages = (variant.images && variant.images.length) ? variant.images'''
          assert text.count(old_variant) == 1, 'modal variant marker not found exactly once'
          text = text.replace(old_variant, new_variant, 1)

          old_flavor_cart = '''    const flavorSelect = document.getElementById('modal-flavor');
              const flavor = flavorSelect ? flavorSelect.value : null;

              let size = null;'''
          new_flavor_cart = '''    const flavorSelect = document.getElementById('modal-flavor');
              const flavor = flavorSelect ? flavorSelect.value : null;

              if (item.flavors && item.flavors.length > 0 && !flavor) {
                  showValidationPopup('Escolha um sabor antes de adicionar à cesta.');
                  if (flavorSelect) flavorSelect.focus();
                  return;
              }

              let size = null;'''
          assert text.count(old_flavor_cart) == 1, 'addToCartFromModal flavor marker not found exactly once'
          text = text.replace(old_flavor_cart, new_flavor_cart, 1)

          old_price_tail = '''    if (lbl) lbl.innerText = 'R$ ' + price.toFixed(2) + ' ' + suffix;
              if (prv) prv.innerHTML = '<span class="text-sm font-bold align-top text-[#2C4A34]/70 mr-0.5">R$</span>' + (price * qty).toFixed(2);'''
          new_price_tail = '''    if (typeof price !== 'number' || Number.isNaN(price)) price = 0;
              if (lbl) lbl.innerText = 'R$ ' + price.toFixed(2) + ' ' + suffix;
              if (prv) prv.innerHTML = '<span class="text-[11px] font-semibold align-top text-[#2C4A34]/65 mr-0.5">R$</span>' + (price * qty).toFixed(2);'''
          assert text.count(old_price_tail) == 1, 'modal price marker not found exactly once'
          text = text.replace(old_price_tail, new_price_tail, 1)

          old_kit_price = '''        if (prv) prv.innerHTML = '<span class="text-sm font-bold align-top text-[#2C4A34]/70 mr-0.5">R$</span>' + total.toFixed(2);'''
          new_kit_price = '''        if (prv) prv.innerHTML = '<span class="text-[11px] font-semibold align-top text-[#2C4A34]/65 mr-0.5">R$</span>' + total.toFixed(2);'''
          assert text.count(old_kit_price) == 1, 'kit modal price marker not found exactly once'
          text = text.replace(old_kit_price, new_kit_price, 1)

          assert text != original, 'no changes made'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit modal redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Melhora experiência do modal de produto"
          git push
