name: Corrigir pao de bolinha

on:
  push:
    paths:
      - '.github/workflows/fix-pao-bolinha.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir produtos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_suco = "id: 'suconatural',\n  name: 'Suco Natural',\n  description: '30 bolinhas recheadas · aprox. 500 g',\n  category: 'Bebidas',\n  image: 'img/AA3FF404-C200-4A86-9007-40B5A16DAC07_nmdlvk.png',\n  price: 68.60,"
          new_suco = "id: 'suconatural',\n  name: 'Suco Natural',\n  description: 'Uma jarra de suco natural, 1 litro',\n  category: 'Bebidas',\n  image: 'img/AA3FF404-C200-4A86-9007-40B5A16DAC07_nmdlvk.png',\n  price: 35.00,"

          old_salgado = "id: 'pb_pao_bolinha_salgado',\n  name: 'Pão de Bolinha Salgado',\n  description: 'Massa caseira (30 bolinhas recheadas).',\n  category: 'Pão de bolinha',\n  image: 'img/pao-de-bolinha-salgado.png',\n  price: 45.00,"
          new_salgado = "id: 'pb_pao_bolinha_salgado',\n  name: 'Pão de Bolinha Salgado',\n  description: '30 bolinhas recheadas · aprox. 500 g',\n  category: 'Pão de bolinha',\n  image: 'img/pao-de-bolinha-salgado.png',\n  price: 68.60,"

          if old_suco not in text:
              raise SystemExit('Trecho do Suco Natural não encontrado.')
          if old_salgado not in text:
              raise SystemExit('Trecho do Pão de Bolinha Salgado não encontrado.')

          text = text.replace(old_suco, new_suco, 1)
          text = text.replace(old_salgado, new_salgado, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commitar correção
        shell: bash
        run: |
          rm -f .github/workflows/fix-pao-bolinha.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-pao-bolinha.yml
          git commit -m "Corrige preços dos pães de bolinha"
          git push
